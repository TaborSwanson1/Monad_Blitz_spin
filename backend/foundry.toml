[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
# Deploy.s.sol records each deployment here for scripts/export.mjs.
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  # Cross-language vectors written by scripts/seed-vectors.mjs, read by test/SeedVectors.t.sol.
  { access = "read", path = "./test/vectors" },
]

[rpc_endpoints]
# Verified 2026-11-15 against docs.monad.xyz (chain ID 10143). Set in backend/.env.
monad_testnet = "${MONAD_TESTNET_RPC}"
